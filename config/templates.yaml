# MemOS Sentinel — English Reply Templates
# All agent comments are in English

question_ack: |
  Thanks for your question about "{title}"!

  I've labeled this as a `question` for tracking. A maintainer will review and respond.
  In the meantime, you might find relevant info in our [documentation](https://github.com/MemTensor/MemOS/tree/main/docs).

bug_needs_info: |
  Thanks for reporting this bug! To help us investigate, could you please provide:

  1. **Steps to reproduce** — What actions trigger the issue?
  2. **Expected behavior** — What should happen?
  3. **Actual behavior** — What happens instead?
  4. **Environment** — OS, Python version, MemOS version
  5. **Logs/errors** — Any relevant error output

  Adding the `needs-info` label until we have more details.

enhancement_ack: |
  Thanks for the feature request: "{title}"!

  We've logged this as an `enhancement`. The team will evaluate it during our next planning cycle.
  If you'd like to contribute an implementation, PRs are welcome!

stale_warning: |
  This issue has been automatically marked as **stale** due to 30+ days of inactivity.
  It will be closed in 7 days unless there is new activity.

  - If this is still relevant, please comment or add the `do not close` label.
  - If this has been resolved, feel free to close it.

stale_close: |
  Closing this issue due to continued inactivity. If the problem persists or you have new information,
  feel free to reopen or create a new issue.

duplicate_found: |
  This issue appears to be a duplicate of {refs}.

  If you believe this is different, please provide additional context explaining
  what distinguishes your issue, and we'll re-evaluate.

pr_review_intro: |
  ## Automated Review by Sentinel

  {review_body}

  ---
  *This review was generated by [memos-sentinel](https://github.com/MemTensor/memos-sentinel).
  Please address the feedback or comment if you disagree.*

dev_pr_created: |
  ## Automated Fix

  I've created PR #{pr_number} with a proposed fix for this issue.

  **Branch:** `{branch_name}`
  **Changes:** {files_summary}

  The PR is in **draft** mode. Once CI passes, a maintainer will review and merge.

ci_passed: |
  CI checks have passed on PR #{pr_number}. Ready for human review.

ci_failed_needs_help: |
  CI checks failed on PR #{pr_number} after {attempts} attempts.
  This needs manual intervention. See the [CI logs]({ci_url}) for details.
